name: Arduino library CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: strict
          project-type: library

  compile:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32
          - esp32:esp32:esp32c3
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          enable-warnings-report: true
          sketch-paths: |
            - examples/ESP32/ESP32_WiFi_Basic
            - examples/ESP32/ESP32_WiFi_Uplink
            - examples/ESP32/ESP32_WiFi_Downlink
            - examples/ESP32/ESP32_WiFi_Listen
            - examples/ESP32/ESP32_WiFi_Gateway
            - examples/ESP32/ESP32_WiFi_Modbus
            - examples/ESP32/ESP32_WiFi_Gps
            - examples/ESP32/ESP32_Gsm_Basic
            - examples/ESP32/ESP32_Gsm_Gps
            - examples/ESP32/ESP32_TC5L_Modbus_Bare
            - examples/ESP32/ESP32_TC5L_Modbus_Gateway
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
            - name: PubSubClient
            - name: ArduinoJson
            - name: TinyGPSPlus
            - source-url: https://github.com/eModbus/eModbus.git
